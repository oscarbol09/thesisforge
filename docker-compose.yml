version: '3.8'

services:
  thesisforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesisforge-server
    restart: unless-stopped
    # -------------------------------------------------------------------------
    # SECURITY & LOCAL-FIRST NETWORK POSTURE (Auditoría Hallazgos 6, 7 & 8):
    #
    # 1. Enlace Local Estricto (Host Port Binding):
    #    Por defecto, enlazamos exclusivamente a 127.0.0.1 (localhost).
    #    Esto previene la exposición accidental del servidor en todas las
    #    interfaces de red del host (0.0.0.0), protegiendo la API en redes
    #    públicas o compartidas.
    #
    # 2. Modelo de Seguridad y Almacenamiento Criptográfico:
    #    ThesisForge opera bajo un modelo local-first / single-tenant. El token
    #    de instancia (master authentication) y las claves del vault de cifrado
    #    (Fernet) se persisten en el volumen 'thesisforge_home'.
    #
    # 3. Despliegue en Redes Externas / Producción:
    #    Si requiere acceso multi-usuario o exposición a redes corporativas/Internet:
    #    - NO exponga el puerto 8000 directamente a 0.0.0.0 sin intermediarios.
    #    - Despliegue obligatoriamente un Reverse Proxy perimetral (Nginx, Caddy
    #      o Traefik) con terminación TLS/HTTPS y autenticación corporativa
    #      (OAuth2/OIDC, Basic Auth o mTLS).
    # -------------------------------------------------------------------------
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      - THESISFORGE_HOST=0.0.0.0
      - THESISFORGE_PORT=8000
      - THESISFORGE_ENVIRONMENT=production
      - THESISFORGE_LOG_LEVEL=INFO
      - THESISFORGE_DATABASE_URL=sqlite+aiosqlite:////app/data/thesisforge.db
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-thesisforge@academic.org}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
    env_file:
      - .env
    volumes:
      - thesisforge_data:/app/data
      - thesisforge_home:/home/thesisforge/.thesisforge
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  thesisforge_data:
    driver: local
  thesisforge_home:
    driver: local

