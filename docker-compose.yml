version: '3.8'

services:
  thesisforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesisforge-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-thesisforge@academic.org}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
    env_file:
      - .env
    volumes:
      - thesisforge_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  thesisforge_data:
    driver: local
