name: Reporte de Error
description: Reporta un error reproducible o comportamiento inesperado en ThesisForge
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un problema en ThesisForge. Por favor completa los campos a continuación para ayudarnos a reproducir y resolver el fallo rápidamente.
  - type: textarea
    id: description
    attributes:
      label: Descripción del Error
      description: Una explicación clara y concisa de lo que ocurrió.
      placeholder: Al intentar ejecutar el asesor metodológico...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente Afectado
      options:
        - "Asesor Metodológico (Máquina de estados / Validadores)"
        - "Servicio RAG y Búsqueda de Literatura"
        - "Router LLM y Proveedores BYOK"
        - "Backend FastAPI y Endpoints REST"
        - "Interfaz de Escritorio (PyWebView)"
        - "Exportación de Documentos (DOCX APA 7)"
        - "Seguridad y Bóveda de Claves"
        - "Otro"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para Reproducir
      description: Instrucciones paso a paso para reproducir el problema.
      placeholder: |
        1. Iniciar la API con 'thesisforge run'
        2. Enviar POST a /api/advisor/respond con payload...
        3. Se observa el siguiente error...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Información del Entorno
      description: Sistema operativo, versión de Python, versión de ThesisForge y proveedor LLM (si aplica).
      value: |
        - Sistema Operativo: [ej. Windows 11, macOS Sequoia, Ubuntu 22.04]
        - Versión de Python: [ej. 3.10.12, 3.12.2]
        - Versión de ThesisForge: [ej. 0.1.0]
        - Proveedor LLM: [ej. OpenRouter, Gemini, Ollama (Llama-3)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o Trazas de Error
      description: Pega aquí cualquier salida de consola o traza de error relevante.
      render: shell

