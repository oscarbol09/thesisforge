name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in ThesisForge
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in ThesisForge! Please fill out the form below to help us reproduce and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I try to run the advisor service...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Advisor Engine (State Machine / Validators)"
        - "RAG Service & Literature Search"
        - "LLM Router & BYOK Providers"
        - "FastAPI Backend & API Endpoints"
        - "Desktop GUI / PyWebView"
        - "Document Export (DOCX APA 7)"
        - "Security & Key Vault"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Start the API with 'thesisforge run'
        2. Send POST to /api/advisor/respond with payload...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, ThesisForge version, LLM Provider (if applicable).
      value: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 22.04]
        - Python Version: [e.g. 3.10.12, 3.12.2]
        - ThesisForge Version: [e.g. 0.1.0]
        - LLM Provider: [e.g. OpenRouter, Gemini, Ollama (Llama-3)]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Trace
      description: Please paste any relevant error output or stack trace.
      render: shell
