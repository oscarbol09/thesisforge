name: RFC para Fuente o Conector Académico
description: Propón un nuevo conector para repositorios científicos (ej. PubMed, IEEE, DOAJ, OpenAlex, Scielo)
title: "[RFC: Conector Académico]: "
labels: ["integration", "rag", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Utiliza esta plantilla para proponer la integración de una nueva base de datos bibliográfica o API de indexación científica en ThesisForge.
  - type: input
    id: source_name
    attributes:
      label: Nombre de la Fuente Académica
      placeholder: ej. PubMed Central / Europe PMC / IEEE Xplore / OpenAlex / Scielo
    validations:
      required: true
  - type: input
    id: api_docs_url
    attributes:
      label: URL de la Documentación de la API
      placeholder: https://api.openalex.org / https://eutils.ncbi.nlm.nih.gov/
    validations:
      required: true
  - type: dropdown
    id: auth_type
    attributes:
      label: Tipo de Autenticación
      options:
        - "Pública / No requiere clave de API"
        - "Clave de API Gratuita (Límite extendido con clave)"
        - "Suscripción Comercial / Clave de Pago"
    validations:
      required: true
  - type: textarea
    id: data_fields
    attributes:
      label: Campos de Metadatos Soportados
      description: ¿La API devuelve títulos, resúmenes, autores, año de publicación, DOIs y URLs de PDF en Open Access?
      placeholder: |
        - Título: Sí
        - Autores y Afiliaciones: Sí
        - Año de Publicación: Sí
        - DOI: Sí
        - Enlace a PDF Open Access: Sí
    validations:
      required: true
  - type: textarea
    id: implementation_notes
    attributes:
      label: Notas de Implementación
      description: Consideraciones sobre límites de tasa (rate limiting), paginación o transporte asíncrono.

