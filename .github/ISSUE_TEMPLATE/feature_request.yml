name: Solicitud de Funcionalidad
description: Sugiere una nueva funcionalidad o mejora técnica para ThesisForge
title: "[PROPUESTA]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por sugerir una mejora para ThesisForge!
  - type: textarea
    id: problem
    attributes:
      label: Problema o Caso de Uso
      description: ¿Tu solicitud está relacionada con una necesidad en el flujo de investigación académica?
      placeholder: Como estudiante o investigador, necesito...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución Propuesta
      description: Describe la solución o comportamiento que te gustaría ver implementado.
      placeholder: Añadir soporte para exportar directamente a formato LaTeX / Overleaf...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
      description: Cualquier solución o enfoque alternativo que hayas evaluado.
  - type: checkboxes
    id: contribution
    attributes:
      label: ¿Te gustaría colaborar con un Pull Request?
      options:
        - label: Sí, puedo implementar esta funcionalidad.
        - label: Puedo ayudar probando y dando retroalimentación.

