name: Release & Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build Wheel and Desktop Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: thesisforge-linux-x86_64
          - os: windows-latest
            artifact_name: thesisforge-windows-x64.exe
          - os: macos-latest
            artifact_name: thesisforge-macos-universal
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (locked) and build tools
        run: |
          uv sync --locked --extra dev
          uv run pip install build pyinstaller

      - name: Verify Quality Gate (Fast Test Suite)
        run: uv run pytest tests/unit/ -v

      - name: Build Python Wheel and sdist (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: uv run python -m build


      - name: Build Standalone Desktop Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "${{ matrix.artifact_name }}" --collect-all chromadb --collect-all litellm --collect-all fitz --collect-all pymupdf --add-data "gui:gui" src/thesisforge/desktop/launcher.py

      - name: Fix macOS dyld LC_UUID
        if: matrix.os == 'macos-latest'
        run: codesign -s - "dist/${{ matrix.artifact_name }}/${{ matrix.artifact_name }}" || true

      - name: Compress Desktop Binary
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            tar -czvf "../${{ matrix.artifact_name }}.tar.gz" *
          else
            tar -czvf "../${{ matrix.artifact_name }}.tar.gz" *
          fi
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
